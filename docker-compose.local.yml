services:
  backend:
    image: traceai-backend:latest
    container_name: traceai-backend-local
    restart: unless-stopped
    env_file: ../ai_soc_workspace/.env
    environment:
      # Ollama на вашем Windows-хосте
      - LLM_BASE_URL=http://host.docker.internal:11434
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traceai-net

  frontend:
    image: traceai-frontend:latest
    container_name: traceai-frontend-local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - traceai-net

networks:
  traceai-net:
    driver: bridge