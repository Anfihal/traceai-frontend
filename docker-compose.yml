services:
  backend:
    build:
      context: ../ai_soc_workspace
      dockerfile: Dockerfile
    image: traceai-backend:latest
    container_name: traceai-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3
      - LLM_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - QUEUE_NAME=llm_tasks
      - QUEUE_THRESHOLD=3
      - SYNC_TIMEOUT_OLLAMA=120
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - traceai-net
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || curl -fsS http://localhost:8000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    image: traceai-backend:latest
    container_name: traceai-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3
      - LLM_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_NAME=llm_tasks
    command: [ "python", "-m", "app.worker" ]
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - traceai-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: traceai-frontend:latest
    container_name: traceai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traceai-net

  redis:
    image: redis:7-alpine
    container_name: traceai-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - traceai-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: traceai-chroma
    restart: unless-stopped
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - traceai-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat || curl -fsS http://localhost:8000/api/v2/heartbeat || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: traceai-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    networks:
      - traceai-net
    healthcheck:
      test: [ "CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

  ollama-init:
    image: ollama/ollama:latest
    container_name: traceai-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: [ "/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3}" ]
    networks:
      - traceai-net
    restart: "no"

networks:
  traceai-net:
    driver: bridge
