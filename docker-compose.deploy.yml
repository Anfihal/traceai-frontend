services:
  backend:
    image: traceai-backend:latest
    container_name: traceai-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3
      - LLM_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - redis
      - ollama
      - chromadb
    networks:
      - traceai-net
    expose:
      - "8000"

  frontend:
    image: traceai-frontend:latest
    container_name: traceai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - traceai-net

  redis:
    image: redis:7-alpine
    container_name: traceai-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - traceai-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: traceai-chroma
    restart: unless-stopped
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - traceai-net

  ollama:
    image: ollama/ollama:latest
    container_name: traceai-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - traceai-net

networks:
  traceai-net:
    driver: bridge
